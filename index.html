<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente Virtual Institucional</title>
  <style>
    :root {
      --primary: #1e3a8a; /* Azul institucional profundo */
      --primary-hover: #172554;
      --secondary: #f3f4f6; /* Gris muy claro para fondos */
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --bg-user: #1e3a8a;
      --text-user: #ffffff;
      --bg-bot: #ffffff;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    
    * { 
      box-sizing: border-box; 
    }
    
    body {
      margin: 0; 
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--secondary); 
      color: var(--text-dark); 
      display: flex; 
      justify-content: center;
      line-height: 1.6;
    }
    
    main { 
      width: 100%; 
      max-width: 880px; 
      padding: 32px 24px; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
    }
    
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
    }
    
    .header-icon {
      width: 40px;
      height: 40px;
      background-color: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-right: 16px;
      font-size: 1.2rem;
    }
    
    h1 { 
      font-size: 1.5rem; 
      font-weight: 600;
      margin: 0;
      color: var(--primary);
    }

    .badge-audit {
      background: #dbeafe;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    
    #chat {
      flex: 1; 
      overflow-y: auto; 
      background: transparent; 
      display: flex; 
      flex-direction: column; 
      gap: 20px;
      padding: 10px 4px 20px;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }
    
    #chat::-webkit-scrollbar {
      width: 6px;
    }
    #chat::-webkit-scrollbar-track {
      background: transparent;
    }
    #chat::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 20px;
    }

    .msg { 
      padding: 16px 20px; 
      border-radius: var(--radius); 
      max-width: 88%; 
      white-space: pre-wrap; 
      font-size: 0.95rem;
      box-shadow: var(--shadow);
      position: relative;
    }
    
    .user { 
      align-self: flex-end; 
      background: var(--bg-user); 
      color: var(--text-user); 
      border-bottom-right-radius: 4px;
    }
    
    .bot { 
      align-self: flex-start; 
      background: var(--bg-bot); 
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      width: 100%;
    }
    
    .bot.error { 
      background: var(--error-bg); 
      color: var(--error-text);
      border-color: #fca5a5;
    }
    
    .bot.pending { 
      color: var(--text-muted); 
      font-style: italic; 
      background: var(--bg-bot);
      box-shadow: none;
      border: 1px dashed #9ca3af;
      width: auto;
    }
    
    .empty { 
      color: var(--text-muted); 
      text-align: center; 
      margin: auto; 
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
    }
    
    .empty svg {
      width: 48px;
      height: 48px;
      color: #9ca3af;
    }

    .input-container {
      background: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-top: auto;
    }

    form { 
      display: flex; 
      gap: 12px; 
      align-items: flex-end;
    }
    
    textarea {
      flex: 1; 
      resize: none; 
      min-height: 48px;
      max-height: 150px;
      padding: 12px 16px; 
      font: inherit;
      font-size: 0.95rem;
      border: none; 
      background: transparent;
      outline: none;
    }
    
    textarea::placeholder {
      color: #9ca3af;
    }
    
    button {
      padding: 12px 24px; 
      height: 48px;
      border: none; 
      border-radius: var(--radius); 
      background: var(--primary);
      color: #fff; 
      font-weight: 600; 
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    button:hover:not(:disabled) { 
      background: var(--primary-hover); 
    }
    
    button:disabled { 
      background: #9ca3af; 
      cursor: not-allowed; 
      opacity: 0.7;
    }
    
    .hint { 
      font-size: 0.75rem; 
      color: var(--text-muted); 
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding: 0 4px;
    }

    .hint label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    /* Markdown Styling */
    .bot.md { white-space: normal; }
    .bot.md table { 
      border-collapse: collapse; 
      margin: 16px 0; 
      font-size: 0.9rem; 
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
    }
    .bot.md th, .bot.md td { 
      border: 1px solid var(--border); 
      padding: 12px 16px; 
      text-align: left; 
    }
    .bot.md th { 
      background: #f8fafc; 
      font-weight: 600;
      color: var(--text-dark);
    }
    .bot.md h1, .bot.md h2, .bot.md h3 { 
      font-size: 1.15rem; 
      margin: 24px 0 12px; 
      color: var(--primary);
      font-weight: 600;
    }
    .bot.md h1:first-child, .bot.md h2:first-child, .bot.md h3:first-child {
      margin-top: 0;
    }
    .bot.md p { margin: 0 0 12px; }
    .bot.md p:last-child { margin-bottom: 0; }
    .bot.md ul, .bot.md ol { 
      margin: 12px 0; 
      padding-left: 24px; 
    }
    .bot.md li { margin-bottom: 6px; }
    .bot.md a { color: var(--primary); text-decoration: none; font-weight: 500;}
    .bot.md a:hover { text-decoration: underline; }
    .bot.md code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 0.85em;
      color: #0f172a;
    }
    .bot.md pre {
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 16px 0;
    }
    .bot.md pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }

    /* Projection Module Styling matching Institutional Theme */
    .proj-card {
      margin-top: 20px;
      padding: 16px 20px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-left: 4px solid var(--primary);
      border-radius: var(--radius);
    }
    .proj-title {
      font-weight: 600;
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .proj-controls {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 12px;
      flex-wrap: wrap;
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .proj-controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: var(--text-dark);
    }
    .proj-controls input {
      padding: 4px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
    }
    .proj-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.4;
    }
    
    /* Loading animation dots */
    .pending-dots {
      display: inline-flex;
      gap: 4px;
    }
    .pending-dots span {
      animation: pulse 1.4s infinite ease-in-out both;
      height: 4px;
      width: 4px;
      background-color: currentColor;
      border-radius: 50%;
      display: inline-block;
    }
    .pending-dots span:nth-child(1) { animation-delay: -0.32s; }
    .pending-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="header-left">
        <div class="header-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </div>
        <h1>Asistente de Análisis de Datos</h1>
      </div>
      <span class="badge-audit">Auditoría Oficial + Proyecciones</span>
    </header>
    
    <div id="chat">
      <div class="empty" id="empty">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        <p>¿En qué puedo ayudarte hoy?</p>
      </div>
    </div>
    
    <div class="input-container">
      <form id="form">
        <textarea id="input" placeholder="Escribe tu consulta aquí..." required></textarea>
        <button id="send" type="submit">
          Enviar
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
    </div>
    <div class="hint">
      <span>Presiona Enter para enviar · Shift + Enter para salto de línea</span>
      <label><input type="checkbox" id="useDirectWebhook" /> Conexión directa a Webhook Saptiva</label>
    </div>
  </main>

  <script>
    // Credenciales de conexión directa a Saptiva
    const SAPTIVA_WEBHOOK_URL = "https://api.laboratorioia.ibero.mx/builder/v1/public/webhooks/workflows/whk_734a2a20f803c65f9c46ab729d76f842";
    const SAPTIVA_TOKEN = "bwhsec_hUSt4ZyTL2yTODY6Dlp1LUmR0q3PPFxtuFAIZ02ZIeA";

    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const useDirectWebhook = document.getElementById('useDirectWebhook');

    // Auto-resize textarea
    input.addEventListener('input', function() {
      this.style.height = '48px';
      this.style.height = (this.scrollHeight) + 'px';
      if(this.value === '') this.style.height = '48px';
    });

    function addMsg(text, cls) {
      document.getElementById('empty')?.remove();
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      
      if(cls.includes('pending')) {
        div.innerHTML = `${text} <div class="pending-dots"><span></span><span></span><span></span></div>`;
      } else {
        div.textContent = text;
      }
      
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    // Motor matemático de proyección paramétrica sobre datos auditados
    function construirPanelProyeccion(markdownText, container) {
      const lines = markdownText.split('\n');
      const municipiosDetectados = {};

      for (const line of lines) {
        if (!line.includes('|')) continue;
        const cols = line.split('|').map(c => c.trim()).filter(Boolean);
        if (cols.length < 3) continue;

        // Detectar columna de CVEGEO (4 o 5 dígitos)
        const cveIndex = cols.findIndex(c => /^\d{4,5}$/.test(c));
        if (cveIndex !== -1) {
          const cve = cols[cveIndex].padStart(5, '0');
          const nombre = cols[0];
          if (!municipiosDetectados[cve]) {
            municipiosDetectados[cve] = { nombre, cve, pob2020: null, dma2023: null };
          }
          for (let i = cveIndex + 1; i < cols.length; i++) {
            const rawVal = cols[i].replace(/,/g, '').match(/-?\d+(\.\d+)?/);
            if (!rawVal) continue;
            const num = parseFloat(rawVal[0]);
            if (num > 1500 && Number.isInteger(num) && !municipiosDetectados[cve].pob2020) {
              municipiosDetectados[cve].pob2020 = num;
            } else if ((num < 0 || cols[i].includes('.')) && Math.abs(num) < 1500 && municipiosDetectados[cve].dma2023 === null) {
              municipiosDetectados[cve].dma2023 = num;
            }
          }
        }
      }

      const lista = Object.values(municipiosDetectados).filter(m => m.pob2020 !== null || m.dma2023 !== null);
      if (lista.length === 0) return;

      const card = document.createElement('div');
      card.className = 'proj-card';

      card.innerHTML = `
        <div class="proj-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          <span>Simulador de Proyección Paramétrica (Basado en Datos Auditados)</span>
        </div>
        <div class="proj-controls">
          <label>Año objetivo: 
            <input type="number" class="anio-input" value="2028" min="2024" max="2050" style="width:75px" />
          </label>
          <label>Tasa Crecimiento Poblacional Anual (%): 
            <input type="number" class="tasa-input" value="1.15" step="0.05" min="-5" max="10" style="width:70px" />
          </label>
          <label>Factor Estrés Hídrico Anual (%): 
            <input type="number" class="agua-input" value="1.50" step="0.1" min="0" max="15" style="width:70px" />
          </label>
        </div>
        <div class="proj-table-container"></div>
        <div class="proj-note">
          <strong>Metodología de Auditoría:</strong> Proyección geométrica poblacional <code>P_t = P_2020 * (1 + r)^(t - 2020)</code> sobre línea base del Censo INEGI 2020. Proyección de presión hídrica (DMA_neta) calculada sobre línea base CONAGUA 2023 y generación per cápita de residuos (0.944 kg/hab/día SEMARNAT). Estimación matemática complementaria; no sustituye proyecciones oficiales de CONAPO.
        </div>
      `;

      const tableContainer = card.querySelector('.proj-table-container');
      const anioInput = card.querySelector('.anio-input');
      const tasaInput = card.querySelector('.tasa-input');
      const aguaInput = card.querySelector('.agua-input');

      function renderProjectionTable() {
        const anio = parseInt(anioInput.value) || 2028;
        const rPob = (parseFloat(tasaInput.value) || 1.15) / 100;
        const rAgua = (parseFloat(aguaInput.value) || 1.50) / 100;
        const nPob = Math.max(0, anio - 2020);
        const nAgua = Math.max(0, anio - 2023);

        let html = `<table>
          <thead>
            <tr>
              <th>Municipio (CVEGEO)</th>
              <th>Población Base (2020)</th>
              <th>Población Proyectada (${anio})</th>
              <th>DMA_neta Base (2023)</th>
              <th>DMA_neta Proyectada (${anio})</th>
              <th>Residuos Est. (${anio})</th>
            </tr>
          </thead>
          <tbody>`;

        for (const m of lista) {
          const pobProj = m.pob2020 ? Math.round(m.pob2020 * Math.pow(1 + rPob, nPob)) : null;
          let dmaProj = null;
          if (m.dma2023 !== null) {
            dmaProj = m.dma2023 < 0 
              ? (m.dma2023 * Math.pow(1 + rAgua, nAgua)).toFixed(2)
              : (m.dma2023 * Math.pow(1 - rAgua, nAgua)).toFixed(2);
          }
          const resProj = pobProj ? ((pobProj * 0.944) / 1000).toFixed(1) + ' ton/día' : 'N/A';

          html += `<tr>
            <td><strong>${m.nombre}</strong> (${m.cve})</td>
            <td>${m.pob2020 ? m.pob2020.toLocaleString('es-MX') : 'N/A'}</td>
            <td><strong>${pobProj ? pobProj.toLocaleString('es-MX') : 'N/A'}</strong></td>
            <td>${m.dma2023 !== null ? m.dma2023 + ' Mm³' : 'N/A'}</td>
            <td style="color:${dmaProj < 0 ? '#991b1b' : '#166534'}; font-weight:600;">
              ${dmaProj !== null ? dmaProj + ' Mm³' : 'N/A'}
            </td>
            <td>${resProj}</td>
          </tr>`;
        }
        html += `</tbody></table>`;
        tableContainer.innerHTML = html;
      }

      anioInput.addEventListener('input', renderProjectionTable);
      tasaInput.addEventListener('input', renderProjectionTable);
      aguaInput.addEventListener('input', renderProjectionTable);
      renderProjectionTable();

      container.appendChild(card);
    }

    function renderBotResponse(bubble, text) {
      if (window.marked && window.DOMPurify) {
        bubble.className = 'msg bot md';
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
        construirPanelProyeccion(text, bubble);
      } else {
        bubble.className = 'msg bot';
        bubble.textContent = text;
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { 
        e.preventDefault(); 
        form.requestSubmit(); 
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMsg(message, 'user');
      input.value = '';
      input.style.height = '48px';
      sendBtn.disabled = true;
      
      const bubble = addMsg('Procesando solicitud', 'bot pending');
      const start = Date.now();
      const timer = setInterval(() => {
        if (bubble.classList.contains('pending')) {
          bubble.innerHTML = `Procesando solicitud (${Math.round((Date.now() - start) / 1000)}s) <div class="pending-dots"><span></span><span></span><span></span></div>`;
        }
      }, 1000);

      try {
        if (useDirectWebhook.checked) {
          const resp = await fetch(SAPTIVA_WEBHOOK_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${SAPTIVA_TOKEN}`
            },
            body: JSON.stringify({ pregunta: message })
          });
          if (!resp.ok) throw new Error(`Error HTTP ${resp.status}`);
          const data = await resp.json();
          const text = data.text || data.output || data.response || data.result || JSON.stringify(data, null, 2);
          renderBotResponse(bubble, text);
        } else {
          const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message }),
          });
          
          if (!resp.ok || !resp.body) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.error || `Error HTTP ${resp.status}`);
          }

          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          let done = false;
          
          while (!done) {
            const chunk = await reader.read();
            if (chunk.done) break;
            buffer += decoder.decode(chunk.value, { stream: true });
            const events = buffer.split('\n\n');
            buffer = events.pop();
            
            for (const block of events) {
              const event = (block.match(/^event: (.*)$/m) || [])[1];
              const dataLine = (block.match(/^data: (.*)$/m) || [])[1];
              if (!event || !dataLine) continue;
              
              const data = JSON.parse(dataLine);
              if (event === 'result') {
                const text = data.text || '(El sistema no generó una respuesta)';
                renderBotResponse(bubble, text);
                done = true;
              } else if (event === 'error') {
                throw new Error(data.message);
              }
            }
            chat.scrollTop = chat.scrollHeight;
          }
          if (!done) throw new Error('La conexión se cerró sin respuesta.');
        }
      } catch (err) {
        bubble.className = 'msg bot error';
        bubble.textContent = 'Error: ' + err.message;
      } finally {
        clearInterval(timer);
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
